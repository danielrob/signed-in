name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  check:
    name: Node ${{ matrix.node }} · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node:
          - 22
          - 24
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 10.0.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Test CLI installation
        run: pnpm exec tsx --test tests/signed-in-cli-install.test.ts
        timeout-minutes: 5
      - name: Test CLI experience
        run: pnpm exec tsx --test tests/signed-in-cli-ux.test.ts
        timeout-minutes: 5
      - name: Test daemon reliability
        run: pnpm exec tsx --test tests/signed-in-reliability.test.ts
        timeout-minutes: 5
      - name: Test skill installation
        run: pnpm exec tsx --test tests/signed-in-skill-install.test.ts
        timeout-minutes: 5
      - name: Test gateway and policy
        run: pnpm exec tsx --test tests/signed-in.test.ts
        timeout-minutes: 5
      - name: Verify package
        run: pnpm pack:check
        timeout-minutes: 5
