name: Bug report
description: Report reproducible signed-in behavior that is not a security vulnerability.
title: "bug: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Do not include credentials, provider sessions, vault files, keychain exports, or live tokens.
  - type: input
    id: version
    attributes:
      label: signed-in version
      placeholder: Output of signed-in --version
    validations:
      required: true
  - type: dropdown
    id: operating-system
    attributes:
      label: Operating system
      options:
        - macOS
        - Windows
        - Linux
    validations:
      required: true
  - type: input
    id: provider
    attributes:
      label: Provider
      placeholder: GitHub, AWS, Clerk, or none
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include the exit code and redacted output.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Provide the smallest safe sequence that reproduces the problem.
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: signed-in doctor
      description: Paste secret-free diagnostic output if relevant.
